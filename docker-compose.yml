services:
  # --- BACKEND (SYMFONY 8 via FrankenPHP) ---
  webgateway:
    build:
      context: ./backend
      target: frankenphp_dev
    # user: "1000:1000"
    user: "root"
    volumes:
      # MODIFICATION ICI : On mappe le dossier ./backend sur /app si le container le demande
      - ./backend:/app
      # On garde aussi le dossier par défaut au cas où
      - ./backend:/srv/app
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_ENV: dev
      APP_SECRET: changer_moi_en_prod
      DATABASE_URL: "mysql://root:root@database:3306/app_db?serverVersion=8.0.32&charset=utf8mb4"
      OLLAMA_URL: "http://ollama:11434"
      # 💡 AJOUTE CETTE LIGNE : Passe le maximum execution time à 5 minutes pour PHP
      MAX_EXECUTION_TIME: 300
      # On indique explicitement à Symfony où se trouve la racine dans le container
      DOCUMENT_ROOT: /app/public
    depends_on:
      database:
        condition: service_healthy # 💡 AJOUTE CECI : Attend que MySQL soit vraiment prêt
      ollama:
        condition: service_started # Reste classique pour Ollama

  # --- DATABASE (MYSQL) ---
  database:
    image: mysql:8.0 # ou mariadb
    container_name: mon-projet-ia-database
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app_db
    
    # 🚀 ON AJOUTE/CORRIGE CE BLOC :
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s  # Vérifier toutes les 5 secondes
      timeout: 5s   # Attendre maximum 5 secondes par essai
      retries: 10   # Essayer jusqu'à 10 fois (donne 50 secondes max à MySQL pour démarrer)
      start_period: 10s # Laisse 10 secondes de répit initial à MySQL avant de tester

  # --- FRONTEND (REACT JS) ---
  frontend:
    image: node:20-alpine
    # 💡 AJOUTE CETTE LIGNE : Évite que le "npm install" ne verrouille node_modules
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
    # MODIFICATION ICI : On force le port 3000 et l'hôte 0.0.0.0 (pour ouvrir au réseau)
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - webgateway

  # --- INTELLIGENCE ARTIFICIELLE (OLLAMA) ---
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  # Téléchargement automatique du modèle d'IA au démarrage
  ollama-pull-model:
    image: curlimages/curl:latest
    depends_on:
      - ollama
    # 💡 MODIFICATION ICI : On remplace "llama3" par "llama3.2" (ou "phi3")
    entrypoint: [ "curl", "-X", "POST", "http://ollama:11434/api/pull", "-d", '{"name": "llama3.2"}' ]

  messenger-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile # Utilise le même Dockerfile que ton app PHP
    container_name: mon-projet-ia-worker
    restart: unless-stopped
    healthcheck:
      disable: true
    # 🚀 La commande magique qui écoute les messages en continu
    # Le "-vv" permet d'avoir des logs très bavards dans Docker pour voir l'IA travailler
    command: php bin/console messenger:consume async -vv
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      # Copie ici les mêmes variables d'environnement que ton service webgateway
      # (DATABASE_URL, MESSENGER_TRANSPORT_DSN, OLLAMA_HOST, etc.)
      APP_ENV: dev
      DATABASE_URL: "mysql://root:root@database:3306/app_db?serverVersion=8.0.32&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: doctrine://default

volumes:
  caddy_data:
  caddy_config:
  db_data:
  ollama_data: