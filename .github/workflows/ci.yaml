name: Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  containers-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Docker Compose services
        run: docker compose up -d --build

      - name: Wait for services
        run: sleep 10

      # 🚀 ÉTAPE AJOUTÉE : On installe proprement les dépendances dans la CI
      - name: Install Composer Dependencies
        run: docker compose run --rm webgateway composer install --prefer-dist --no-progress --no-interaction

      # 🎯 Ensuite, tes tests s'exécuteront sans aucun problème de droits
      - name: Run Quality and Security Tests
        run: docker compose run --rm webgateway composer test

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs