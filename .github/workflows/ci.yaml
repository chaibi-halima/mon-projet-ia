name: Continuous Integration

# 1. On déclenche la CI à chaque push ou pull request sur la branche principale
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  containers-tests:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : On récupère le code de ton dépôt GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Étape 2 : On démarre tes conteneurs Docker (comme sur ta machine !)
      - name: Start Docker Compose services
        run: docker compose up -d --build

      # Étape 3 : On attend que la base de données soit prête si nécessaire
      - name: Wait for services
        run: sleep 10

      # Étape 4 : L'apothéose : On lance TOUS tes tests d'un coup dans le conteneur
      - name: Run Quality and Security Tests
        run: docker compose exec -T webgateway composer test