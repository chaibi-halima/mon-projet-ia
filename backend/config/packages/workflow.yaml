# config/packages/workflow.yaml
framework:
    workflows:
        article_generation:
            type: 'state_machine'
            marking_store:
                type: 'method'
                property: 'status'
            supports:
                - App\Entity\Article
            places:
                - pending
                - processing
                - scheduled
                - success
                - failed
            transitions:
                start_processing:
                    from: pending
                    to:   processing
                mark_success:
                    from: processing
                    to:   success
                mark_failed:
                    from: [pending, processing]
                    to:   failed
                return_processing:
                    from: failed
                    to:   processing
                schedule:
                    from: [pending, processing]
                    to:   scheduled
                publish_scheduled:
                    from: scheduled
                    to:   success