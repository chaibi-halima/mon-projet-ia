# backend/config/packages/api_platform.yaml
api_platform:
    title: 'Mon API avec IA'
    version: '1.0.0'
    mapping:
        paths:
            - '%kernel.project_dir%/src/Entity'
            
    # 💡 AJOUTE CETTE SECTION :
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json'] # 👈 Permet d'accepter le JSON standard !

    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header

    defaults:
        openapi_context:
            components:
                securitySchemes:
                    bearerAuth:
                        type: http
                        scheme: bearer
                        bearerFormat: JWT
                        description: "Collez uniquement votre jeton JWT brut (le mot 'Bearer' sera ajouté automatiquement)."
            security:
                - bearerAuth: []
    mercure:
        enabled: true