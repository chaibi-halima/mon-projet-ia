security:
    # 1. Gestion du hachage des mots de passe
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # 2. Comment récupérer les utilisateurs (ici via l'email en BDD)
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # 3. Le pare-feu pour la route de connexion (React envoie le JSON ici)
        login:
            pattern: ^/api/login_check
            stateless: true
            json_login:
                check_path: /api/login_check # 💡 On remet le chemin textuel avec le slash !
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # 4. Le pare-feu principal pour sécuriser toutes les autres routes de l'API
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    # 5. Les règles d'accès (qui a le droit de voir quoi)
    access_control:
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        
        # 🔒 1. On verrouille STRICTEMENT la création, modification et génération IA
        - { path: ^/api/articles/generate, roles: IS_AUTHENTICATED_FULLY, methods: [POST] }
        - { path: ^/api/articles, roles: IS_AUTHENTICATED_FULLY, methods: [POST, PUT, PATCH, DELETE] }
        
        # 🔓 2. On laisse TOUT le reste public (L'accès à /api, la doc Swagger, et la lecture des articles)
        - { path: ^/api, roles: PUBLIC_ACCESS }